services:
  # 1. The RAG Service (Python FastAPI with OCR Support)
  - type: web
    name: legal-ai-rag
    env: docker
    dockerContext: .
    dockerfilePath: deployment/Dockerfile.rag
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: NVIDIA_API_KEY
        sync: false

  # 2. The API Gateway & Frontend (Node.js)
  - type: web
    name: legal-ai-gateway
    env: docker
    dockerContext: .
    dockerfilePath: deployment/Dockerfile.gateway
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RAG_SERVICE_URL
        value: https://legal-ai-rag-6nu1.onrender.com
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
